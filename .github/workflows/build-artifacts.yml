name: Build Artifacts

run-name: Build ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  GO_VERSION: "1.25.6"
  NODE_VERSION: 22
  NODE_OPTIONS: --max-old-space-size=4096

permissions:
  contents: read

concurrency:
  group: build-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-app:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-latest
          - platform: darwin
            runner: macos-latest
          - platform: windows
            runner: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Force git deps to HTTPS
        run: |
          git config --global url.https://github.com/.insteadof ssh://git@github.com/
          git config --global url.https://github.com/.insteadof git@github.com:

      - uses: nick-fields/retry@v3
        name: npm ci
        with:
          command: npm ci --no-audit --no-fund
          retry_on: error
          max_attempts: 3
          timeout_minutes: 10
        env:
          GIT_ASKPASS: "echo"
          GIT_TERMINAL_PROMPT: "0"

      - name: Install Zig (non-macOS)
        if: matrix.platform != 'darwin'
        uses: mlugg/setup-zig@v2

      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools libopenjp2-tools rpm squashfs-tools
          sudo gem install fpm
          sudo snap install snapcraft --classic
          sudo snap install lxd
          sudo lxd init --auto
          sudo snap refresh

      - name: Install Windows packaging dependencies
        if: matrix.platform == 'windows'
        run: gem install fpm

      - name: Install macOS packaging dependencies
        if: matrix.platform == 'darwin'
        run: sudo gem install fpm

      - name: Build package
        run: task package
        env:
          USE_SYSTEM_FPM: true
          CSC_IDENTITY_AUTO_DISCOVERY: false
          SNAPCRAFT_BUILD_ENVIRONMENT: host

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: build-${{ matrix.platform }}
          path: make
          if-no-files-found: error
